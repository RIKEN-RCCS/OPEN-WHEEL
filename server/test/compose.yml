services:
  wheel_release_test_server:
    image: naoso5/test-openpbs
    hostname: wheel_release_test_server
    ports:
      - "4000:22"
    container_name: wheel_release_test_server
    cap_add:
      - SYS_RESOURCE
    volumes:
      - /tmp/WHEEL_TEST/shared:/data/shared

  wheel_release_test:
    build:
      context: ../../
      dockerfile: Dockerfile
      target: UT
    image: wheel_release_test
    ports:
      - "8089:8089"
    environment:
      WHEEL_USE_HTTP: 1
      WHEEL_USE_PORT: 8089
      WHEEL_TEST_REMOTEHOST: testServer
      WHEEL_TEST_REMOTE_PASSWORD: passw0rd
      WHEEL_RUNNING_TEST: 1
      WHEEL_LOGLEVEL: OFF
      NODE_ENV: test

    volumes:
      - "./${WHEEL_CONFIG_DIR}:/usr/src/server/app/config"
