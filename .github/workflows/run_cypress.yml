name: Cypress Tests
on:
  push:
    branches:
      - '**'
      - '!master'
jobs:
  cypress-run:
    services:
      testbed:
        image: naoso5/openpbs
        ports:
          - 4000:22
    env:
      TZ: JST-9
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CYPRESS_WHEEL_TEST_REMOTEHOST: ${{ secrets.WHEEL_TEST_REMOTEHOST }}
      CYPRESS_WHEEL_TEST_REMOTE_PASSWORD: ${{ secrets.WHEEL_TEST_REMOTE_PASSWORD }}
      CYPRESS_WHEEL_TEST_HOSTNAME: ${{ secrets.WHEEL_TEST_HOSTNAME }}
      CYPRESS_WHEEL_TEST_PORT: ${{ secrets.WHEEL_TEST_PORT }}
      CYPRESS_WHEEL_TEST_USER: ${{ secrets.WHEEL_TEST_USER }}
      CYPRESS_WHEEL_PATH: '/root'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        browser: [chrome]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and start WHEEL container
        run: |
          docker build --target exec -t wheel_e2e_test .
          docker run -d --name test-wheel_release_test-1 \
            -p 8089:8089 \
            -e WHEEL_USE_HTTP=1 \
            -e WHEEL_LOGLEVEL=ERROR \
            wheel_e2e_test
          # Copy config files into the container
          docker cp test/wheel_config/. test-wheel_release_test-1:/root/.wheel/
          # Wait for server to be ready
          timeout 300 bash -c 'until curl -f http://localhost:8089 > /dev/null 2>&1; do sleep 2; done'
      - name: Install test dependencies
        working-directory: test
        run: npm install --ignore-scripts
      - name: Install Cypress binary
        working-directory: test
        run: npx cypress install
      - name: Start mock servers
        working-directory: test
        run: |
          GW_PORT=3001 REAL_APP=http://localhost:8089 MOCK_SIO=http://localhost:3101 node ws-gateway.cjs > gateway.log 2>&1 &
          echo $! > gateway.pid
          npm run mocks > httpmock.log 2>&1 &
          echo $! > httpmock.pid
          npx wait-on tcp:127.0.0.1:3001 tcp:127.0.0.1:3102 --timeout 60000
      - name: Run E2E tests with mock server
        working-directory: test
        run: npm run test:e2e:mock:run
      - name: upload gateway/mocks logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-mocks-logs
          path: |
            test/gateway.log
            test/httpmock.log
          if-no-files-found: ignore
      - name: upload screenshot
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: test/cypress/screenshots/**/*.png
          if-no-files-found: ignore

      - name: upload video
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: test/cypress/videos
          if-no-files-found: ignore

      - name: Stop WHEEL container
        if: always()
        run: |
          kill $(cat test/gateway.pid 2>/dev/null) 2>/dev/null || true
          kill $(cat test/httpmock.pid 2>/dev/null) 2>/dev/null || true
          docker stop test-wheel_release_test-1 || true
          docker rm test-wheel_release_test-1 || true
