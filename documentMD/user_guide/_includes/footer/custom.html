<div class="page__footer text-right">
	{% for tongue in site.languages %}
	    <a {% if tongue == site.active_lang %}style="font-weight: bold;"{% endif %} {% static_href %}href="{% if tongue == site.default_lang %}{{site.baseurl}}{{page.url}}{% else %}{{site.baseurl}}/{{ tongue }}{{page.url}}{% endif %}"{% endstatic_href %} >{{ tongue }}</a>{%- if forloop.last == false -%}{{" "}}{{ site.langsep }}{%- endif -%}
	{% endfor %}
</div>

<div class="wheel-lightbox-overlay" id="wheel-lightbox">
  <button type="button" class="wheel-lightbox-close" aria-label="Close">&times;</button>
  <img src="" alt="">
  <div class="wheel-lightbox-caption"></div>
</div>

<script>
(function () {
  var overlay = document.getElementById("wheel-lightbox");
  var overlayImg = overlay.querySelector("img");
  var caption = overlay.querySelector(".wheel-lightbox-caption");
  var closeBtn = overlay.querySelector(".wheel-lightbox-close");
  var content = document.querySelector(".page__content");

  function openLightbox(img) {
    overlayImg.src = img.currentSrc || img.src;
    var text = img.title || img.alt || "";
    caption.textContent = text;
    caption.style.display = text ? "" : "none";
    overlay.classList.add("is-visible");
  }

  function closeLightbox() {
    overlay.classList.remove("is-visible");
    overlayImg.src = "";
  }

  if (content) {
    content.addEventListener("click", function (event) {
      var img = event.target.closest("img");
      if (!img || event.target.closest("a")) {
        return;
      }
      openLightbox(img);
    });
  }

  overlay.addEventListener("click", function (event) {
    if (event.target === overlay || event.target === closeBtn) {
      closeLightbox();
    }
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && overlay.classList.contains("is-visible")) {
      closeLightbox();
    }
  });
})();
</script>
