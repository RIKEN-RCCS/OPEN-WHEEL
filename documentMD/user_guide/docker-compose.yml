services:
  service_jekyll:
    image: "jekyll/jekyll:latest"
    environment:
      - JEKYLL_UID=${UID}
      - JEKYLL_GID=${GID}
      - JEKYLL_DISABLE_DISK_CACHE=1
    volumes:
      - .:/srv/jekyll/
    command: >
      bash -c "gem install webrick &&
      gem install jekyll-remote-theme &&
      gem install jekyll-include-cache &&
      gem install jekyll-polyglot &&
      jekyll serve"
    ports:
      - "4001:4000"
    tty: true
    stdin_open: true
