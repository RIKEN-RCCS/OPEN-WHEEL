services:
  wheel_release_test_server:
    image: naoso5/test-openpbs
    ports:
      - "8000:22"
    container_name: wheel_release_test_server
    cap_add:
      - SYS_RESOURCE
    volumes:
      - /tmp/WHEEL_TEST/shared:/data/shared

  wheel_release_test:
    build:
      context: ../
      dockerfile: Dockerfile
      target: exec
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}

    image: wheel_e2e_test
    container_name: wheel
    ports:
      - "8089:8089"
    environment:
      WHEEL_USE_HTTP: 1
      WHEEL_USE_PORT: 8089
      WHEEL_TEST_REMOTEHOST: testServer
      WHEEL_TEST_REMOTE_PASSWORD: passw0rd
      WHEEL_LOGLEVEL: OFF
    volumes:
      - "./wheel_config:/root/.wheel"
      - /tmp/WHEEL_TEST/shared:/mnt/shared


  mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: mock
    ports:
      - "3101:3101"
      - "3102:3102"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: gateway
    ports:
      - "3001:3001"
    environment:
      REAL_APP: http://wheel_release_test:8089
      MOCK_SIO: http://mock:3101
      MOCK_HTTP: http://mock:3102
    depends_on:
      - wheel_release_test
      - mock
